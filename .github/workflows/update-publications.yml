name: Update Publications from Google Scholar

on:
  schedule:
    - cron: '0 3 * * 0'  # Every Sunday at 3 AM UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: update-publications
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Verify publication update safeguards
        run: npm test -- tests/fetch-publications.test.js

      - name: Fetch publications from Google Scholar
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: node scripts/fetch_publications.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/publications.json
          git diff --cached --quiet || git commit -m "chore: auto-update publications from Google Scholar"
          git push
